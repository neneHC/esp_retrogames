; PlatformIO Project Configuration File para Ideaspark ESP32 ST7789 + Bluepad32 + NES

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
platform_packages = 
	framework-arduinoespressif32 @ https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip
board_build.partitions = no_ota.csv
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
build_flags = 
	-D USER_SETUP_LOADED=1
	-D ST7789_DRIVER=1
	-D TFT_WIDTH=135
	-D TFT_HEIGHT=240
	-D CGRAM_OFFSET=1
	-D TFT_MOSI=23
	-D TFT_SCLK=18
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=4
	-D TFT_BL=32
	-D TFT_BACKLIGHT_ON=1
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=6000000
	-I lib/nofrendo/src
	-D NOFRENDO_DEBUG=0
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_speed = 115200
